[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tikz-funfig"
version = "0.1.0"
description = "Schema-driven reproducible TikZ/PGFPlots figure generation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
funfig = "funfig.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

