<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="TIKZ-FunFig immutable example gallery">
  <title>TIKZ-FunFig Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="eyebrow">TIKZ-FunFig</p>
        <h1 data-i18n="gallery">示例图库</h1>
        <p class="lede" data-i18n="lede">按永久 TFF 编号浏览示例。在提示词中引用编号，即可复用相应的布局与风格。</p>
      </div>
      <div class="header-actions">
        <div class="language-switch" role="group" aria-label="网站语言">
          <button type="button" data-language="zh" aria-pressed="true">中文</button>
          <button type="button" data-language="en" aria-pressed="false">English</button>
        </div>
        <a class="repo-link" href="https://github.com/iihciyekub/tikz-funfig">GitHub ↗</a>
      </div>
    </div>
  </header>
  <main>
    <section class="usage" aria-label="How to use TIKZ-FunFig">
      <h2 data-i18n="usageTitle">怎么使用</h2>
      <p data-i18n="usage">选择一个示例，点击「复制提示词」，填写你的内容后发给 TIKZ-FunFig。自然语言即可，示例用于布局与风格，科研内容以你提供的材料为准。</p>
      <p data-i18n="meaning">分层、分组和模块组织可参考框架图；变量路径、中介与调节假设可参考关系图。只有明确的步骤顺序、判断和分支才按流程图表达。</p>
    </section>
    <section class="controls" aria-label="Gallery controls">
      <input id="search" type="search" placeholder="搜索 TFF-0042、标题、类型、标签…" autocomplete="off">
      <select id="kind" aria-label="按示例类别筛选"><option value="">全部类别</option></select>
      <span id="count" class="count"></span>
    </section>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>没有匹配的示例。</p>
  </main>
  <template id="card-template">
    <article class="card">
      <a class="preview-link" target="_blank" rel="noreferrer">
        <img class="preview" loading="lazy" alt="">
      </a>
      <div class="card-body">
        <div class="meta-row"><code class="tff-id"></code><span class="kind"></span></div>
        <h2 class="title"></h2>
        <p class="description"></p>
        <div class="tags"></div>
        <details class="prompt-example">
          <summary>Example prompt / 示例提示词</summary>
          <pre class="prompt-text"></pre>
        </details>
        <div class="actions">
          <button class="copy-id" type="button">Copy ID</button>
          <button class="copy-prompt" type="button">Copy prompt</button>
          <a class="source" target="_blank" rel="noreferrer">Source ↗</a>
          <a class="origin" target="_blank" rel="noreferrer" hidden>Origin ↗</a>
        </div>
      </div>
    </article>
  </template>
  <script src="i18n.js" defer></script>
  <script src="prompts.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
